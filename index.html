
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-a-mole</title>

    <link rel="icon" href="rick2.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="bgmusic.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>


    <!-- PLAYER AUTHENTICATION -->
    <div class="auth-container" id="authContainer">

        <h2>Player Account</h2>

        <!-- Registration -->
        <div id="registerForm">
            <h3>Create Account</h3>

            <input
                type="text"
                id="registerName"
                placeholder="Your name"
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
            >

            <button onclick="registerUser()">Register</button>
        </div>


        <!-- Login -->
        <div id="loginForm">
            <h3>Already registered? Login</h3>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button onclick="loginUser()">Login</button>
        </div>


        <!-- Authentication Messages -->
        <p id="authMessage"></p>

        <p id="loggedInUser"></p>

        <button
            id="logoutButton"
            onclick="logoutUser()"
            style="display: none;"
        >
            Logout
        </button>

    </div>


    <!-- GAME HEADING -->
    <h1>
        Click-a-Rick!
        <span class="score">0</span>
    </h1>


    <!-- TIMER -->
    <h2 class="timer">
        Time Left:
        <span class="time-left">10</span>s
    </h2>


    <!-- HIGH SCORE -->
    <h2 class="high-score-display">
        High Score:
        <span class="high-score">0</span>
    </h2>


    <!-- PLAYER NAME -->
    <h3>
        Player:
        <span id="playerName">Guest</span>
    </h3>


    <!-- GAME OVER -->
    <h2 class="game-over" style="display: none;">
        Game Over!
    </h2>


    <!-- DIFFICULTY -->
    <div class="difficulty-select">

        <label for="difficulty">Difficulty:</label>

        <select id="difficulty" onchange="updateDifficulty()">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>

    </div>


    <!-- GAME CONTROLS -->
    <div class="controls">

        <button onclick="startGame()">Start!</button>

        <button onclick="toggleMusic()">Mute/Unmute</button>

    </div>


    <!-- GAME BOARD -->
    <div class="game">

        <div class="hole hole1">
            <div class="mole"></div>
        </div>

        <div class="hole hole2">
            <div class="mole"></div>
        </div>

        <div class="hole hole3">
            <div class="mole"></div>
        </div>

        <div class="hole hole4">
            <div class="mole"></div>
        </div>

        <div class="hole hole5">
            <div class="mole"></div>
        </div>

        <div class="hole hole6">
            <div class="mole"></div>
        </div>

    </div>


    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>2025 &Star; Aratrika Kundu</p>
        </div>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>
</html>
